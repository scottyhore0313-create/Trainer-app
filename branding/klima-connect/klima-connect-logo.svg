<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 200" width="590" height="200">
  <defs>
    <linearGradient id="kc-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#F4511E"/>
    </linearGradient>
  </defs>
  <!-- Emblem: cooling (blue) and heating (orange) arrows forming a connected cycle -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M31.1 87.8 A70 70 0 0 1 165.8 76.1" stroke="#1E88E5"/>
    <path d="M168.9 112.2 A70 70 0 0 1 34.2 123.9" stroke="#F4511E"/>
  </g>
  <polygon points="170.6,94.3 178.1,70.3 153.5,79.3" fill="#1E88E5"/>
  <polygon points="29.4,105.7 21.9,129.7 46.5,120.7" fill="#F4511E"/>
  <!-- K monogram: navy stem, cool upper arm, warm lower arm -->
  <rect x="72" y="62" width="16" height="76" rx="3" fill="#0D2B45"/>
  <polygon points="88,96 116,62 136,62 100,106" fill="#1E88E5"/>
  <polygon points="96,104 108,94 138,138 118,138" fill="#F4511E"/>
  <!-- Wordmark -->
  <g font-family="Montserrat, 'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="224" y="104" font-size="68" font-weight="800" fill="#0D2B45" letter-spacing="2">KLIMA</text>
    <text x="227" y="142" font-size="27" font-weight="600" fill="url(#kc-word)" letter-spacing="11.5">CONNECT</text>
    <text x="228" y="170" font-size="11.5" font-weight="500" fill="#5B6B7A" letter-spacing="1.4">CHAUFFAGE · CLIMATISATION · QUALITÉ DE L’AIR</text>
  </g>
</svg>
